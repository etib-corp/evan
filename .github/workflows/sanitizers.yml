name: Sanitizers & Static Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Install Ubuntu dependencies
        run: bash scripts/install_ubuntu_dependencies.sh

      - name: Configure Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure CMake with sanitizers
        run: >
          cmake
          -B ${{ github.workspace }}/build
          -S ${{ github.workspace }}
          -DBUILD_FOR_GLFW=ON
          -DBUILD_FOR_LINUX=ON
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: >
          cmake
          --build ${{ github.workspace }}/build

      - name: Run tests under sanitizers
        env:
          # GoogleTest sorts each suite's tests with std::stable_sort, whose
          # scratch buffer comes from libstdc++'s get_temporary_buffer. On
          # GCC 13 that buffer is allocated with nothrow new but released
          # through the C library allocator, so ASan reports an
          # alloc-dealloc-mismatch for every suite and aborts the run. The
          # mismatch is inside libstdc++/GoogleTest, not in EVAN, so keep the
          # rest of ASan enabled and disable only this check.
          ASAN_OPTIONS: alloc_dealloc_mismatch=0
        run: >
          ctest
          --test-dir ${{ github.workspace }}/build
          --output-on-failure

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy

      - name: Install Ubuntu dependencies
        run: bash scripts/install_ubuntu_dependencies.sh

      - name: Configure Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure CMake
        run: >
          cmake
          -B ${{ github.workspace }}/build
          -S ${{ github.workspace }}
          -DBUILD_FOR_GLFW=ON
          -DBUILD_FOR_LINUX=ON
          -DBUILD_TESTING=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on built sources
        # Lint only the translation units present in the compile database. Each
        # TU's headers are analyzed transitively. This avoids parsing headers
        # that are not part of the configured backend build (e.g. OpenXR
        # headers in a GLFW-only build), which previously produced spurious
        # missing-header errors.
        run: >
          jq -r '.[].file'
          ${{ github.workspace }}/build/compile_commands.json
          | grep "${{ github.workspace }}/sources"
          | xargs clang-tidy
          -p ${{ github.workspace }}/build
          --quiet

  # Coverage is collected for every backend/OS combination that builds the
  # tests. Android is excluded: tests are not built there and CI has no
  # device/emulator to run them on.
  coverage:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The names are passed to the Codecov CLI as `--name <value>` without
          # quoting, so they must not contain spaces.
          - name: GLFW-Linux
            engine-backend: glfw
            operating-system: linux
            runner: ubuntu-latest
            configure_flags: "-DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage"
          - name: OpenXR-Linux
            engine-backend: openxr
            operating-system: linux
            runner: ubuntu-latest
            configure_flags: "-DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage"
          - name: GLFW-macOS
            engine-backend: glfw
            operating-system: macos
            runner: macos-latest
            # The nested quotes are required: the whole flag list is expanded
            # unquoted into the shell command, so the space between the two
            # clang flags must be protected from word splitting.
            configure_flags: "-DCMAKE_CXX_FLAGS='-fprofile-instr-generate -fcoverage-mapping' -DCMAKE_EXE_LINKER_FLAGS=-fprofile-instr-generate"
          # OpenCppCoverage instruments the MSVC debug build, so no extra
          # compiler/linker flags are needed on Windows. The flags must stay
          # undefined there: passing an empty CMAKE_CXX_FLAGS drops the MSVC
          # defaults (/DWIN32 /D_WINDOWS /W3 /GR /EHsc).
          - name: GLFW-Windows
            engine-backend: glfw
            operating-system: windows
            runner: windows-latest
            configure_flags: ""
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Install lcov
        if: matrix.operating-system == 'linux'
        run: sudo apt-get install -y lcov

      - name: Install Ubuntu dependencies
        if: matrix.operating-system == 'linux'
        run: bash scripts/install_ubuntu_dependencies.sh

      - name: Install OpenCppCoverage
        if: matrix.operating-system == 'windows'
        run: choco install -y opencppcoverage

      - name: Configure Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure CMake with coverage
        run: >
          cmake
          -B ${{ github.workspace }}/build
          -S ${{ github.workspace }}
          -DBUILD_FOR_GLFW=${{ matrix.engine-backend == 'glfw' }}
          -DBUILD_FOR_OPENXR=${{ matrix.engine-backend == 'openxr' }}
          -DBUILD_FOR_LINUX=${{ matrix.operating-system == 'linux' }}
          -DBUILD_FOR_MACOS=${{ matrix.operating-system == 'macos' }}
          -DBUILD_FOR_WINDOWS=${{ matrix.operating-system == 'windows' }}
          -DBUILD_FOR_ANDROID=OFF
          -DBUILD_TESTING=ON
          ${{ matrix.configure_flags }}

      - name: Build
        run: >
          cmake
          --build ${{ github.workspace }}/build
          --config Debug

      - name: Run tests
        if: matrix.operating-system != 'windows'
        env:
          # GCC ignores this; clang on macOS writes one profile per process.
          LLVM_PROFILE_FILE: ${{ github.workspace }}/coverage-%p.profraw
        run: >
          ctest
          --test-dir ${{ github.workspace }}/build
          --output-on-failure

      - name: Run tests under OpenCppCoverage
        if: matrix.operating-system == 'windows'
        # --sources accepts several paths and acts as an allowlist, so instrument
        # EVAN's translation units and its headers only.
        run: >
          & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
          --sources ${{ github.workspace }}\sources
          --sources ${{ github.workspace }}\headers
          --cover_children
          --export_type cobertura:${{ github.workspace }}\coverage.xml
          --
          ctest
          --test-dir ${{ github.workspace }}\build
          -C Debug
          --output-on-failure

      - name: Generate coverage report (Linux)
        if: matrix.operating-system == 'linux'
        run: |
          # Measure EVAN only: an include allowlist drops the toolchain
          # headers, third_party/, build/_deps/ and VULKAN_SDK/ (downloaded
          # inside the workspace) without relying on --no-external, which
          # treats every file outside the scanned build directory as external
          # and therefore discards all of EVAN's own sources.
          lcov --capture \
            --directory "${{ github.workspace }}/build" \
            --include "${{ github.workspace }}/sources/*" \
            --include "${{ github.workspace }}/headers/*" \
            --ignore-errors unused \
            --output-file coverage.info
          # lcov 2.x writes to stdout when no output file is given, and its
          # report keeps absolute paths whereas Codecov expects paths relative
          # to the repository root.
          sed -i.bak "s#^SF:${{ github.workspace }}/#SF:#" coverage.info
          rm -f coverage.info.bak

      - name: Generate coverage report (macOS)
        if: matrix.operating-system == 'macos'
        run: |
          xcrun llvm-profdata merge -sparse "${{ github.workspace }}"/coverage-*.profraw \
            -o "${{ github.workspace }}/coverage.profdata"
          xcrun llvm-cov export "${{ github.workspace }}/build/tests/test_evan" \
            -instr-profile="${{ github.workspace }}/coverage.profdata" \
            -format=lcov \
            -ignore-filename-regex='.*/(third_party|_deps|tests|examples)/.*' \
            > "${{ github.workspace }}/coverage.info"
          # Codecov expects paths relative to the repository root.
          sed -i.bak "s#^SF:${{ github.workspace }}/#SF:#" "${{ github.workspace }}/coverage.info"
          rm -f "${{ github.workspace }}/coverage.info.bak"

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.operating-system == 'windows' && 'coverage.xml' || 'coverage.info' }}
          # The Codecov upload is non-fatal, so a report that was never written
          # would otherwise only show up as missing coverage on Codecov.
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.0.0
        with:
          # `main` is a protected branch, so Codecov rejects tokenless
          # uploads. Set the repository's upload token as CODECOV_TOKEN.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.operating-system == 'windows' && 'coverage.xml' || 'coverage.info' }}
          name: ${{ matrix.name }}
          fail_ci_if_error: false

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Install Ubuntu dependencies
        run: bash scripts/install_ubuntu_dependencies.sh

      - name: Configure Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure CMake with benchmarks
        run: >
          cmake
          -B ${{ github.workspace }}/build
          -S ${{ github.workspace }}
          -DBUILD_FOR_GLFW=ON
          -DBUILD_FOR_LINUX=ON
          -DBUILD_BENCHMARKS=ON

      - name: Build benchmarks
        run: >
          cmake
          --build ${{ github.workspace }}/build
          --target evan_benchmarks

      - name: Run benchmarks (report)
        run: >
          ${{ github.workspace }}/build/benchmarks/evan_benchmarks
          --benchmark_min_time=0.01s
